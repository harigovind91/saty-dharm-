<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control Node | Sovereign HAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --red: #ff3333; --bg: #05070a; --green: #128807; --panel: #0f1218; }
        
        body { 
            background: var(--bg); color: white; font-family: 'Poppins', sans-serif; 
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* Security Lock Screen */
        #lock-screen {
            position: fixed; inset: 0; background: black; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .security-card {
            background: #111; padding: 40px; border-radius: 20px; border: 1px solid var(--gold);
            text-align: center; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px; background: var(--panel); border-right: 1px solid #222;
            display: flex; flex-direction: column; padding: 25px;
        }
        .nav-btn {
            padding: 15px; border-radius: 12px; color: #888; cursor: pointer;
            margin-bottom: 10px; transition: 0.3s; display: flex; align-items: center; gap: 15px;
        }
        .nav-btn:hover, .nav-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); }

        /* Content Area */
        .main-view { flex: 1; overflow-y: auto; padding: 30px; background: radial-gradient(circle at top right, #0a0e14, #05070a); }
        
        /* Command Components */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: var(--panel); padding: 25px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .stat-box h3 { font-size: 28px; color: var(--gold); margin: 0; }

        .broadcast-panel { 
            background: linear-gradient(90deg, #1a0000, #05070a); 
            border: 1px solid var(--red); padding: 25px; border-radius: 20px; margin-bottom: 30px;
        }
        textarea { 
            width: 100%; background: #000; color: #0f0; border: 1px solid #333; 
            padding: 15px; border-radius: 12px; font-family: monospace; resize: none; margin: 15px 0;
        }

        /* Database Table */
        .data-table-wrapper { background: var(--panel); border-radius: 20px; border: 1px solid #222; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1a1e26; color: var(--gold); padding: 18px; text-align: left; font-family: 'Cinzel'; }
        td { padding: 18px; border-bottom: 1px solid #1a1e26; font-size: 14px; }

        .action-icon { 
            width: 35px; height: 35px; border-radius: 8px; border: none; 
            cursor: pointer; color: white; margin-right: 5px;
        }
        .bg-wa { background: #25D366; }
        .bg-pay { background: var(--green); }
        .bg-print { background: var(--gold); color: black; }

        @media print { .sidebar, .broadcast-panel, #lock-screen, .action-icon { display: none; } .main-view { padding: 0; margin: 0; } }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="security-card">
        <i class="fas fa-microchip" style="font-size: 50px; color: var(--gold); margin-bottom: 20px;"></i>
        <h2 style="font-family: 'Cinzel'; color: var(--gold);">Sovereign Access Only</h2>
        <input type="password" id="adminPass" style="padding:15px; border-radius:10px; border:1px solid #333; background:#000; color:white; width: 250px; text-align:center;" placeholder="Master Security Key">
        <br><br>
        <button onclick="authenticate()" style="padding:12px 40px; background:var(--gold); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Initialize Node</button>
    </div>
</div>

<div class="sidebar">
    <div style="font-family: 'Cinzel'; color: var(--gold); font-size: 24px; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px;">
        Sovereign HAI
    </div>
    <div class="nav-btn active"><i class="fas fa-database"></i> Citizen Database</div>
    <div class="nav-btn"><i class="fas fa-credit-card"></i> Payment Node</div>
    <div class="nav-btn"><i class="fas fa-robot"></i> AI Response Hub</div>
    <div class="nav-btn" onclick="window.print()"><i class="fas fa-file-pdf"></i> Print Reports</div>
    
    <div style="margin-top: auto;">
        <button onclick="warCry()" style="width: 100%; padding: 15px; background: var(--red); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">
            <i class="fas fa-bullhorn"></i> युद्ध उदघोषणा
        </button>
    </div>
</div>

<div class="main-view">
    <div class="broadcast-panel">
        <h3 style="margin-top:0; color: var(--red);"><i class="fas fa-satellite"></i> Universal Broadcast (AI + Manual)</h3>
        <textarea id="broadcastMsg" rows="3" placeholder="यहाँ संदेश लिखें जो संसार के सभी सक्रिय डिवाइसेस पर जाएगा..."></textarea>
        <div style="display: flex; gap: 10px;">
            <button onclick="sendBroadcast()" style="padding: 10px 25px; background: white; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Send Global</button>
            <button onclick="aiOptimizedMsg()" style="padding: 10px 25px; background: transparent; color: var(--gold); border: 1px solid var(--gold); border-radius: 8px; cursor: pointer;">AI Optimization</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-box"><h3><span id="nodeCount">0</span></h3><p>Active Citizens</p></div>
        <div class="stat-box"><h3>₹<span id="revCount">0</span></h3><p>Sovereign Fund</p></div>
        <div class="stat-box"><h3>Online</h3><p>Network Status</p></div>
    </div>

    <div class="data-table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Entry Date</th>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Status / Pay</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="memberList"></tbody>
        </table>
    </div>
</div>

<script>
    const MASTER_KEY = "HARI_AI_2026"; // आपकी मास्टर सुरक्षा चाबी

    function authenticate() {
        if(document.getElementById('adminPass').value === MASTER_KEY) {
            document.getElementById('lock-screen').style.display = 'none';
            refreshData();
        } else { alert("Access Denied: Invalid Authorization."); }
    }

    function refreshData() {
        const members = JSON.parse(localStorage.getItem('hai_members') || '[]');
        const list = document.getElementById('memberList');
        list.innerHTML = '';
        
        let totalRev = 0;
        document.getElementById('nodeCount').innerText = members.length;

        members.reverse().forEach((m, i) => {
            totalRev += parseInt(m.amount || 0);
            list.innerHTML += `
                <tr>
                    <td>${m.date}</td>
                    <td style="color:var(--gold); font-weight:bold;">${m.name}</td>
                    <td>${m.district}, ${m.country}</td>
                    <td><span style="color:var(--green);">₹${m.amount || 0}</span></td>
                    <td>
                        <button class="action-icon bg-wa" onclick="contact('${m.phone}', '${m.name}')" title="WhatsApp Message"><i class="fab fa-whatsapp"></i></button>
                        <button class="action-icon bg-pay" onclick="managePay(${i})" title="Update Payment"><i class="fas fa-hand-holding-usd"></i></button>
                        <button class="action-icon bg-print" onclick="alert('Printing Citizen ID for ${m.name}')" title="Print ID"><i class="fas fa-print"></i></button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('revCount').innerText = totalRev;
    }

    function contact(num, name) {
        const msg = encodeURIComponent(`नमस्ते ${name}, सत्य धर्म स्थापना नेटवर्क की ओर से आपके लिए महत्वपूर्ण संदेश है...`);
        window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
    }

    function managePay(index) {
        let amt = prompt("इस नागरिक द्वारा दिया गया नया योगदान दर्ज करें (INR):");
        if(amt !== null) {
            let members = JSON.parse(localStorage.getItem('hai_members'));
            members[index].amount = amt;
            localStorage.setItem('hai_members', JSON.stringify(members));
            refreshData();
        }
    }

    function sendBroadcast() {
        const msg = document.getElementById('broadcastMsg').value;
        if(msg) alert("BROADCAST SENT: " + msg + "\nसंसार के सभी सक्रिय नोड्स पर संदेश भेज दिया गया है।");
    }

    function warCry() {
        if(confirm("सावधान: क्या आप 'युद्ध उदघोषणा' मोड सक्रिय करना चाहते हैं? यह अत्यंत चरम स्थिति के लिए है।")) {
            document.body.style.filter = "sepia(1) hue-rotate(-50deg) saturate(2)";
            alert("उदघोषणा सक्रिय: संसार के सभी क्षेत्रों के वैज्ञानिक हरिगोविंद सिंह चौहान के अधीन नेटवर्क को नियंत्रित कर रहे हैं।");
        }
    }

    function aiOptimizedMsg() {
        const box = document.getElementById('broadcastMsg');
        box.value = "AI Optimization: " + box.value + " [सत्य धर्म की जय हो]";
    }
</script>

</body>
                                                 </html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सत्य धर्म स्थापना - HAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="flag-wrapper">
        <div class="layer saffron"></div>
        <div class="layer white"></div>
        <div class="layer green"></div>
    </div>

    <nav class="navbar">
        <div class="logo"><span>HAI</span></div>
        <div class="nav-menu">
            <a href="#"><i class="fas fa-home"></i> होम</a>
            <a href="#donate" class="donate-shortcut">योगदान दें</a>
        </div>
    </nav>

    <div class="flag-container">
        <div class="flag">
            <div class="stripe saffron"></div>
            <div class="stripe white">
                <span class="flag-text">सत्य धर्म स्थापना</span>
            </div>
            <div class="stripe green"></div>
        </div>
        <div class="pole"></div>
    </div>

    <div class="hero-container">
        <div class="glass-card main-card">
            <div class="brand-header">
                <div class="icon-circle">
                    <i class="fas fa-om"></i>
                </div>
                <h1>सत्य धर्म स्थापना</h1>
                <p class="subtitle">अखंड ज्योति • शाश्वत सत्य • अनंत काल</p>
            </div>

            <div class="welcome-section">
                <p>सत्य और धर्म के मार्ग पर आपका स्वागत है। मानवता की सेवा ही हमारा परम लक्ष्य है।</p>
            </div>

            <div class="donation-box" id="donate">
                <h3>मानवता सेवा में योगदान</h3>
                <div class="amount-input">
                    <span class="currency">₹</span>
                    <input type="number" id="donateAmount" placeholder="राशि दर्ज करें">
                </div>
                <button class="btn-upi" onclick="triggerUPI()">
                    <i class="fab fa-google-pay"></i> UPI द्वारा दान दें
                </button>
                <div class="trust-badge">
                    <i class="fas fa-lock"></i> सुरक्षित भुगतान: 43137160754@sbi
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
            </html>

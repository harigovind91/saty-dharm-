<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Certificate</title>
    <style>
        body { background: #222; display: flex; justify-content: center; padding: 20px; font-family: serif; }
        .cert { width: 800px; padding: 40px; background: #fffcf0; border: 15px solid #D4AF37; position: relative; text-align: center; box-shadow: 0 0 40px #000; }
        .photo { width: 120px; height: 140px; border: 2px solid #D4AF37; position: absolute; top: 40px; right: 40px; overflow: hidden; }
        .photo img { width: 100%; height: 100%; object-fit: cover; }
        h1 { color: #002366; font-size: 45px; margin: 10px; }
        @media print { .btn-p { display: none; } }
    </style>
</head>
<body>
    <div class="cert">
        <div class="photo"><img id="u-img" src=""></div>
        <div style="font-size:50px;">☀️</div>
        <h1>सत्य धर्म स्थापना</h1>
        <h2 style="color:#b8860b; letter-spacing:10px;">प्रमाण पत्र</h2>
        <p style="font-size:20px;">यह प्रमाणित किया जाता है कि वैश्विक नागरिक</p>
        <div id="u-name" style="font-size:35px; font-weight:bold; border-bottom:2px double #D4AF37; display:inline-block; padding:0 30px;">---</div>
        <p style="margin-top:30px;">इन्होंने मानवता की रक्षा और सत्य धर्म के मार्ग को स्वीकार किया है।</p>
        <div style="margin-top:50px; display:flex; justify-content:space-around; font-weight:bold;">
            <span>नोड आईडी: HAI-2026</span>
            <span>तारीख: <span id="u-date"></span></span>
        </div>
        <button class="btn-p" onclick="window.print()" style="margin-top:30px; padding:10px 30px; background:#D4AF37; border:none; cursor:pointer;">Print Certificate</button>
    </div>
    <script>
        window.onload = () => {
            const u = JSON.parse(localStorage.getItem('lastUser') || '{"name":"Citizen"}');
            const p = localStorage.getItem('user_photo');
            document.getElementById('u-name').innerText = u.name;
            document.getElementById('u-date').innerText = new Date().toLocaleDateString();
            if(p) document.getElementById('u-img').src = p;
        };
    </script>
</body>
</html>

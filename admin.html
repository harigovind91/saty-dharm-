<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>प्रशासनिक कंट्रोल - HAI</title>
    <style>
        body { font-family: sans-serif; background: #0a0e17; color: white; margin: 0; padding: 30px; }
        .admin-box { max-width: 1000px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 20px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #FF9933; background: #252525; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #FF9933; padding-bottom: 15px; }
    </script>
</head>
<body>
    <div class="admin-box">
        <div class="header">
            <h2>HAI - प्रशासनिक डैशबोर्ड</h2>
            <button onclick="clearData()" style="padding:10px; background:#ff4d4d; color:white; border:none; border-radius:5px; cursor:pointer;">डेटा साफ़ करें</button>
        </div>
        <table>
            <thead>
                <tr><th>नाम</th><th>मोबाइल</th><th>विशेष रुचि</th><th>तारीख</th></tr>
            </thead>
            <tbody id="memberList"></tbody>
        </table>
    </div>

    <script>
        function loadMembers() {
            const members = JSON.parse(localStorage.getItem('hai_members') || '[]');
            const list = document.getElementById('memberList');
            list.innerHTML = members.map(m => `
                <tr><td>${m.name}</td><td>${m.phone}</td><td>${m.interest}</td><td>${m.date}</td></tr>
            `).join('');
        }
        function clearData() { if(confirm("क्या आप सारा डेटा हटाना चाहते हैं?")) { localStorage.removeItem('hai_members'); loadMembers(); } }
        window.onload = loadMembers;
    </script>
</body>
</html>
